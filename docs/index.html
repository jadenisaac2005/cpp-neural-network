<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Digit Recognizer</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }
        #drawingCanvas {
            border: 3px solid black;
            cursor: crosshair;
            background-color: white;
            /* Don't let a finger drag scroll or zoom the page. */
            touch-action: none;
            /* Shrink to fit narrow screens; pixel size stays 280x280. */
            box-sizing: border-box;
            max-width: 100%;
            height: auto;
        }
        #privacyNotice {
            font-size: 0.8em;
            color: #555;
            margin: 6px 16px 0;
        }
        #labelPanel p, #savedMessage {
            margin: 8px 0;
        }
        #labelButtons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 16px;
            padding: 0 16px;
        }
        /* Two rows of five on narrow screens. */
        @media (max-width: 600px) {
            #labelButtons {
                max-width: 304px;
            }
        }
        #labelButtons button {
            width: 48px;
            height: 48px;
            font-size: 1.3em;
        }
        h2 {
            font-size: 2em;
        }
        #probabilities {
            max-width: 280px;
            margin: 0 auto;
            font-family: monospace;
            text-align: left;
        }
        .prob-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 2px 0;
        }
        .prob-label {
            width: 1.5em;
        }
        .prob-bar-track {
            flex: 1;
            background: #ddd;
            height: 12px;
        }
        .prob-bar-fill {
            background: #4a90d9;
            height: 100%;
        }
        .prob-value {
            width: 4.5em;
            text-align: right;
        }
        .prob-row.top .prob-bar-fill {
            background: #2e7d32;
        }
    </style>
</head>
<body>
    <h1>Draw a Digit (0-9)</h1>
    <canvas id="drawingCanvas" width="280" height="280"></canvas>
    <p id="privacyNotice">Your drawings and the model's guesses are saved anonymously to help test the model.</p>
    <br><br>
    <button id="predictButton">Predict</button>
    <button id="clearButton">Clear</button>
    <h2>Prediction: <span id="result">?</span></h2>
    <div id="labelPanel" hidden>
        <p>What did you draw?</p>
        <div id="labelButtons"></div>
    </div>
    <p id="savedMessage" hidden>Saved, draw another</p>
    <div id="probabilities"></div>

    <script src="network.js?v=33d03e78"></script>
    <script src="main.js?v=b602759f"></script>
</body>
</html>
